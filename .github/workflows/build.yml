name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      # Unit tests, a universal release build and the localization check.
      # Packaging the .app needs Xcode 26+ for the Icon Composer icon, so it is not part of CI.
      - name: Check
        run: ./check.sh
